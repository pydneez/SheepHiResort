# Checks every pull request (and every push to main):
#   1. game file names are lowercase without spaces
#   2. Godot imports the project and starts the game without errors
#   3. headless gameplay tests in tests/ pass
name: Godot checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2   # keep in step with the Godot version the team uses
      GODOT: /home/runner/godot/godot

    steps:
      - uses: actions/checkout@v4

      - name: File names are lowercase without spaces
        run: bash tools/ci/check_file_names.sh

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot
          curl -sSfL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d /home/runner/godot
          mv "/home/runner/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT"
          chmod +x "$GODOT"

      - name: Import the project
        run: bash tools/ci/godot_run.sh --import

      - name: Start the game
        run: bash tools/ci/godot_run.sh --fixed-fps 60 --quit-after 300

      - name: Gameplay tests
        run: |
          failed=0
          for t in tests/test_*.gd; do
            echo "::group::$t"
            bash tools/ci/godot_run.sh --fixed-fps 60 -s "res://$t" || failed=1
            echo "::endgroup::"
          done
          exit $failed
